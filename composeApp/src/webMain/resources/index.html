<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charty playground — charts for Compose Multiplatform</title>
    <meta name="description" content="Try every Charty chart in your browser: change the data, the axes, the animation and the theme, and watch the same Compose code you would ship re-render live.">
    <meta property="og:title" content="Charty playground">
    <meta property="og:description" content="Every Charty chart, with its configuration exposed as controls you can turn. Running in your browser via WebAssembly.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hi-manshu.github.io/charty/">
    <meta name="theme-color" content="#6650a4">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236650a4'/><rect x='7' y='17' width='4' height='9' rx='1.4' fill='white'/><rect x='14' y='11' width='4' height='15' rx='1.4' fill='white'/><rect x='21' y='6' width='4' height='20' rx='1.4' fill='white'/></svg>">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
    <!--
      The playground is a WebAssembly bundle of some megabytes, so there is a real wait before
      anything paints. Without this the page is blank white for that whole time, which reads as
      broken rather than loading.

      It goes away as soon as Compose puts anything of its own into the body. The test is
      deliberately "an element that is not this one appeared" rather than a look for a canvas:
      Compose Multiplatform renders the web target into plain elements, and which ones is its
      business, not this page's.
    -->
    <div id="charty-loading" role="status" aria-live="polite">
        <div class="charty-loading__bars" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="charty-loading__text">Loading the playground…</p>
    </div>
    <script>
        (function () {
            var loader = document.getElementById('charty-loading');
            if (!loader) {
                return;
            }
            var mounted = function () {
                return !loader.isConnected || [].some.call(document.body.children, function (child) {
                    return child !== loader;
                });
            };
            var dismiss = function () {
                loader.classList.add('is-done');
                window.setTimeout(function () { loader.remove(); }, 300);
            };
            if (mounted()) {
                dismiss();
                return;
            }
            var observer = new MutationObserver(function () {
                if (mounted()) {
                    observer.disconnect();
                    dismiss();
                }
            });
            observer.observe(document.body, { childList: true });
        })();
    </script>
</body>
</html>
