name: Deploy site

# Builds the documentation site and the Compose/Wasm playground and publishes both to GitHub Pages:
# the docs at the root, the playground under /playground.
#
# Both are assembled by the Gradle build rather than here, so the directory this uploads is the same
# one a developer gets locally. A site whose parts are only ever joined together on CI is a site
# whose links can only be tested on CI.

on:
  push:
    branches: [main]
    paths:
      - "charty/**"
      - "composeApp/**"
      - "docs/**"
      - "docsite/**"
      - "img/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The project applies the Android Gradle plugin, so even a Wasm-only build
      # configures the Android modules and needs the SDK + accepted licenses.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Renders the docs and builds the playground, then assembles them into one directory. The
      # generator fails on a dead link, so a broken cross-reference stops the deploy rather than
      # reaching a reader.
      - name: Build the site
        run: ./gradlew :docsite:assembleSite --no-daemon -PkotlinYarnLockMismatchReport=warning

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docsite/build/published-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
