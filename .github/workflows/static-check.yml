name: Static check

# Enforces the quality gates the README badge advertises: ktlint, detekt, and the library tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: static-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # AGP configures the Android modules, so the SDK + licenses must be present.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon -PkotlinYarnLockMismatchReport=warning

      - name: detekt
        run: ./gradlew detekt --no-daemon

      - name: Library tests
        run: ./gradlew :charty:jvmTest --no-daemon
