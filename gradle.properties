#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Publishing
GROUP=com.himanshoe
# VERSION_NAME must be provided via environment variable or -PVERSION_NAME=x.y.z
POM_ARTIFACT_ID=charty
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Maven Central credentials (set via environment variables or in local.properties)
# mavenCentralUsername=your_username
# mavenCentralPassword=your_password

# Signing configuration (set via environment variables or in local.properties)
# signing.keyId=your_key_id
# signing.password=your_password
# signing.secretKeyRingFile=/path/to/secring.gpg

